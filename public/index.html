<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hispace</title>
  <style>
    :root {
      --bg-dark: #120e24;
      --bg-sidebar: #17132e;
      --bg-chat: #1f1a3a;
      --bg-hover: #29244a;
      --accent-gold: #f5ba42;
      --text-main: #e2e1e8;
      --text-muted: #8e8a9f;
      --error-red: #ff5555;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

    #auth-screen {
      position: fixed; inset: 0; background: var(--bg-dark); display: flex;
      align-items: center; justify-content: center; z-index: 100;
    }
    .auth-box {
      background: var(--bg-sidebar); border: 1px solid #2a244d; border-radius: 12px;
      padding: 32px; width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .auth-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input {
      width: 100%; padding: 10px 12px; background: #0f0c1d; border: 1px solid #332d56;
      border-radius: 6px; color: #fff; outline: none;
    }
    .input-group input:focus { border-color: var(--accent-gold); }
    .btn {
      width: 100%; padding: 12px; background: var(--accent-gold); color: #000;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .toggle-auth { text-align: center; margin-top: 12px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
    #auth-error { color: var(--error-red); font-size: 12px; margin-top: 10px; text-align: center; display: none; }

    #app-screen { display: flex; width: 100vw; height: 100vh; }
    
    .server-bar { width: 72px; background: #0c0a18; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 12px; }
    .server-icon { width: 48px; height: 48px; border-radius: 16px; background: var(--accent-gold); color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; }

    .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid #252042; }
    .server-header { padding: 16px; font-weight: bold; border-bottom: 1px solid #252042; }
    .channels-list { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .channel-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text-muted); }
    .channel-item.active, .channel-item:hover { background: var(--bg-hover); color: #fff; }

    .chat-area { flex: 1; background: var(--bg-chat); display: flex; flex-direction: column; }
    .chat-header { height: 56px; border-bottom: 1px solid #252042; display: flex; align-items: center; padding: 0 20px; font-weight: bold; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    
    .msg { display: flex; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #4a3e7d; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .msg-content { flex: 1; }
    .msg-header { display: flex; gap: 8px; font-size: 12px; margin-bottom: 4px; }
    .msg-author { font-weight: bold; color: #fff; }
    .msg-time { color: var(--text-muted); }
    .msg-text { line-height: 1.4; color: var(--text-main); }
    
    .chat-input-area { padding: 16px; background: var(--bg-sidebar); }
    .chat-input { width: 100%; padding: 12px 16px; background: #0f0c1d; border: 1px solid #332d56; border-radius: 8px; color: #fff; outline: none; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-title" id="auth-title">Welcome Back</div>
      <div class="input-group">
        <label>USERNAME</label>
        <input type="text" id="username-input" placeholder="Enter username">
      </div>
      <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" id="password-input" placeholder="Enter password">
      </div>
      <button class="btn" onclick="submitAuth()">Sign In</button>
      <div id="auth-error"></div>
      <div class="toggle-auth" onclick="toggleAuthMode()" id="auth-toggle">Need an account? Register</div>
    </div>
  </div>

  <div id="app-screen" style="display: none;">
    <div class="server-bar">
      <div class="server-icon">NO</div>
    </div>

    <div class="sidebar">
      <div class="server-header">Night Owls</div>
      <div class="channels-list" id="channels-list"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="current-channel-name"># general</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="message-input" placeholder="Message #general" onkeypress="handleKeyPress(event)">
      </div>
    </div>
  </div>

  <script>
    let isRegister = false;
    let currentUser = null;
    let activeChannel = 'general';
    let ws = null;

    function toggleAuthMode() {
      isRegister = !isRegister;
      document.getElementById('auth-title').innerText = isRegister ? 'Create Account' : 'Welcome Back';
      document.getElementById('auth-toggle').innerText = isRegister ? 'Already have an account? Sign In' : 'Need an account? Register';
      document.getElementById('auth-error').style.display = 'none';
    }

    async function submitAuth() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errBox = document.getElementById('auth-error');
      errBox.style.display = 'none';

      if (!username || !password) {
        errBox.innerText = 'Please enter both username and password.';
        errBox.style.display = 'block';
        return;
      }

      const endpoint = isRegister ? '/api/register' : '/api/login';
      
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          currentUser = data.username;
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'flex';
          initApp();
        } else {
          errBox.innerText = data.error || 'Authentication failed.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Server connection failed.';
        errBox.style.display = 'block';
      }
    }

    function initApp() {
      initWebSocket();
      loadChannels();
      loadMessages(activeChannel);
    }

    function initWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'new_message' && data.message.channel_id === activeChannel) {
            appendMessage(data.message);
          }
        } catch (e) {
          console.error('Error parsing WebSocket message:', e);
        }
      };
    }

    async function loadChannels() {
      try {
        const res = await fetch('/api/channels');
        const channels = await res.json();
        const container = document.getElementById('channels-list');
        container.innerHTML = '';
        channels.forEach(ch => {
          const div = document.createElement('div');
          div.className = `channel-item ${ch.id === activeChannel ? 'active' : ''}`;
          div.innerText = `# ${ch.name}`;
          div.onclick = () => switchChannel(ch.id, ch.name);
          container.appendChild(div);
        });
      } catch (err) {
        console.error('Failed to load channels:', err);
      }
    }

    function switchChannel(id, name) {
      activeChannel = id;
      document.getElementById('current-channel-name').innerText = `# ${name}`;
      document.getElementById('message-input').placeholder = `Message #${name}`;
      loadChannels();
      loadMessages(id);
    }

    async function loadMessages(channelId) {
      if (!channelId) return;
      try {
        const res = await fetch(`/api/messages/${channelId}`);
        const messages = await res.json();
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        if (Array.isArray(messages)) {
          messages.forEach(appendMessage);
        }
      } catch (err) {
        console.error('Failed to load chat history:', err);
      }
    }

    function appendMessage(msg) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg';
      const initial = (msg.username || '?').charAt(0).toUpperCase();
      const time = new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="msg-content">
          <div class="msg-header">
            <span class="msg-author">${msg.username}</span>
            <span class="msg-time">${time}</span>
          </div>
          <div class="msg-text">${msg.content}</div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('message-input');
        const content = input.value.trim();
        if (content && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'chat_message',
            channelId: activeChannel,
            username: currentUser,
            content: content
          }));
          input.value = '';
        }
      }
    }
  </script>
</body>
</html>
